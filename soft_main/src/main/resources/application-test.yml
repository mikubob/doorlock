# ==========================================================================
# OA 开放平台（T-02）
#
# 【临时方案 · 必须改】app-key / app-secret 当前明文写在 yml 中，
#   目的是先把「静态常量硬编码」收敛到配置文件，便于按环境区分。
#   真正的目标形态是走环境变量，配置项应写成：
#       app-key: ${OA_APP_KEY:}
#       app-secret: ${OA_APP_SECRET:}
#   并删除下面两行的真实值。
#
# 【TODO 上线前必做】
#   1. 联系 OA 侧吊销当前 key/secret（密钥已随源码进入 Git 历史，泄露已成事实），
#      重新签发三套（dev / test / prd）独立凭据；
#   2. 将三个环境的 yml 全部改为 ${OA_APP_KEY:} / ${OA_APP_SECRET:} 占位符；
#   3. 在部署环境以环境变量（或配置中心）注入新凭据；
#   4. 确认 .gitignore 已排除本地覆盖文件（application-local*.yml）。
#   —— 完成第 1~4 步后，本注释块可一并删除。
#
# 注意：凭据为空时应用会启动失败（OaPropertiesValidator），属有意设计，
#       目的是把「配置没配好」挡在启动期，而不是等凌晨 3 点定时同步才报错。
# ==========================================================================
oa:
  base-url: https://dmp.hnkjxy.net.cn
  # TODO 上线前替换为 ${OA_APP_KEY:}，由环境变量注入
  app-key: 20250622398919366238010517831682779
  # TODO 上线前替换为 ${OA_APP_SECRET:}，由环境变量注入
  app-secret: e6c226b86065d7a8df88a5e3119ba6d0491b791a
  connect-timeout: 10000
  read-timeout: 30000
  # token 缓存 55 分钟（提前 5 分钟过期），需与 OA 侧真实有效期核对
  token-cache-seconds: 3300
  # 与课表同步的截断闸门共用同一语义
  page-size: 1000

# 课表同步（T-01）
# 说明：sync-on-startup 开启后，应用启动完成时会同步一次课表；生产环境建议保持 false
schedule:
  sync:
    enabled: true
    sync-on-startup: false
    cron: "0 0 3 * * ?"
    batch-size: 500
    # 数据量保护：低于下面任一阈值即放弃同步并保留旧数据
    min-rows: 50
    shrink-guard-ratio: 0.5
    page-size: 1000
    lock-ttl-seconds: 1800

